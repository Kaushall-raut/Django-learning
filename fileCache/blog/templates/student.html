<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>file base cache</title>
  </head>
  <body>
    <h1>File based cache</h1>
    <table border="1">
      <tr>
        <th>name</th>
        <th>Email</th>
      </tr>
      <tr>
        
        {% for value in data %}
            <tr>
                <td>
                    {{value.name}}
                </td>
                <td>
                    {{value.email}}
                </td>
            </tr>
        {% endfor %}
            
      </tr>
    </table>
  </body>
</html>
