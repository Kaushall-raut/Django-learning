<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>per cache</title>
  </head>
  <body>
    <h1>per view cache</h1>
    <table border="1">
      <tr>
        <th>name</th>
        <th>email</th>
      </tr>

      {% for i in data %}
      <tr>
        <td>{{i.name}}</td>
        <td>{{i.email}}</td>
      </tr>
      {% endfor %}
    </table>
  </body>
</html>
