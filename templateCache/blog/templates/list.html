<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>template fragment cache</title>
</head>
<body>
    <h1>template fragment cache</h1>
    {% load cache %}
    {% cache 500 student %}
        {% for i in data  %}
        <h4>{{i.name}}</h4>
        {% endfor %}
        
    {% endcache %}
</body>
</html>
